<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #27272a;
      padding-bottom: 8px;
    }
    .logo {
      width: 20px;
      height: 20px;
      background: #2563eb;
      color: #fff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
    }
    .title {
      font-size: 13px;
      font-weight: 600;
    }
    .status-box {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      margin-bottom: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      background: #2563eb;
      color: #fff;
      text-align: center;
      padding: 8px 0;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      box-sizing: border-box;
      border: none;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn.secondary {
      background: #3f3f46;
    }
    .btn.secondary:hover {
      background: #52525b;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .msg {
      font-size: 11px;
      margin-top: 6px;
      min-height: 14px;
      color: #a1a1aa;
    }
    .msg.ok { color: #4ade80; }
    .msg.err { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">G</div>
    <div class="title">Gemini Web to Local Bridge</div>
  </div>
  <div class="status-box">
    <div>伺服器端點: <strong>127.0.0.1:8765/v1</strong></div>
    <div style="margin-top: 6px; color: #38bdf8; font-weight: 500;">💡 快速指引：</div>
    <div style="margin-top: 3px; color: #a1a1aa; line-height: 1.4;">
      • <strong>MCP 模式</strong>：免啟動伺服器，點擊下方「複製 Cookie」或「下載 JSON」即可。<br>
      • <strong>API 模式</strong>：執行 <code>start_server.bat</code> 啟動本地端點 (8765)。
    </div>
  </div>
  <button id="btn-capture" class="btn">⚡ 一鍵抓取 Cookie (自動同步/複製)</button>
  <button id="btn-download-cookie" class="btn secondary">📥 下載 gemini_cookies.json 檔案</button>
  <button id="btn-copy-cookie" class="btn secondary">📋 複製 Cookie JSON 到剪貼簿</button>
  <button id="btn-copy-config" class="btn" style="background: #059669;">📋 複製 Kilo / Cline 推薦配置</button>
  <a href="http://127.0.0.1:8765" target="_blank" class="btn secondary" style="font-size: 11px; padding: 6px 0;">開啟控制儀表板 (需啟動伺服器)</a>
  <div id="msg" class="msg"></div>
  <script src="popup.js"></script>
</body>
</html>

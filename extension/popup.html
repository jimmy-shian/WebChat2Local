<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <title>WebChat2Local</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --surface-subtle: #18181b;
      --border: #27272a;
      --border-subtle: #1f1f23;
      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-primary);
      padding: 16px;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .tag {
      font-family: var(--font-mono);
      font-size: 10px;
      background: var(--surface-subtle);
      color: var(--text-muted);
      padding: 2px 5px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      margin-bottom: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--danger);
    }

    .dot.connected {
      background: var(--success);
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
    }

    .info-row {
      font-size: 11.5px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      word-break: break-all;
    }

    .code-box {
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 8px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: #e4e4e7;
      line-height: 1.45;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .btn {
      flex: 1;
      display: block;
      background: var(--surface-subtle);
      color: var(--text-primary);
      text-align: center;
      padding: 7px 0;
      border-radius: 4px;
      font-size: 11.5px;
      font-weight: 500;
      text-decoration: none;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn:hover {
      background: #27272a;
      border-color: #3f3f46;
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .btn.primary:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">WebChat2Local</div>
    <span class="tag">Gateway</span>
  </div>

  <div class="card">
    <div class="card-title">伺服器連線狀態</div>
    <div class="status-indicator">
      <div class="dot" id="server-dot"></div>
      <strong id="server-status" style="font-weight:500;">檢查伺服器中...</strong>
    </div>
    <div class="info-row" id="server-details">http://127.0.0.1:8765/v1</div>
  </div>

  <div class="card">
    <div class="card-title">本地工具連線設定 (Cline / Codex)</div>
    <div class="code-box">
Base URL: http://127.0.0.1:8765/v1<br>
API Key: sk-local<br>
Model: gpt-4o
    </div>
  </div>

  <div class="btn-group">
    <a href="http://127.0.0.1:8765" target="_blank" class="btn primary">控制面板</a>
    <a href="https://chat.deepseek.com" target="_blank" class="btn">DeepSeek</a>
    <a href="https://chatgpt.com" target="_blank" class="btn">ChatGPT</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #27272a;
      padding-bottom: 8px;
    }
    .logo {
      width: 20px;
      height: 20px;
      background: #2563eb;
      color: #fff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
    }
    .title {
      font-size: 13px;
      font-weight: 600;
    }
    .status-box {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      margin-bottom: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      background: #2563eb;
      color: #fff;
      text-align: center;
      padding: 8px 0;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      box-sizing: border-box;
      border: none;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn.secondary {
      background: #3f3f46;
    }
    .btn.secondary:hover {
      background: #52525b;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .msg {
      font-size: 11px;
      margin-top: 6px;
      min-height: 14px;
      color: #a1a1aa;
    }
    .msg.ok { color: #4ade80; }
    .msg.err { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">G</div>
    <div class="title">Gemini Web to Local Bridge</div>
  </div>
  <div class="status-box">
    <div>伺服器端點: <strong>127.0.0.1:8765/v1</strong></div>
    <div style="margin-top: 6px; color: #fbbf24; font-weight: 500;">⚠️ 本地工具 (Kilo / Cline) 上限建議：</div>
    <div style="margin-top: 3px; color: #a1a1aa; line-height: 1.4;">
      • <strong>Context Window</strong>: 請設定為 <strong>16k ~ 32k</strong> (16,000 ~ 32,000 tokens)<br>
      • <strong>切勿設為 128k 或無限制</strong>，避免對話過長超出 Gemini Web 網頁端輸入上限！
    </div>
  </div>
  <button id="btn-copy-config" class="btn" style="background: #10b981;">複製 Kilo / Cline 推薦配置</button>
  <button id="btn-capture" class="btn">抓取 Cookie 並存入本地</button>
  <a href="http://127.0.0.1:8765" target="_blank" class="btn secondary">開啟控制儀表板</a>
  <div id="msg" class="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
